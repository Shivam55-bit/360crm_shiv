<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>360CRM Desktop Tracker</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
      color: #f8fafc;
      padding: 24px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      user-select: none;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 16px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .logo-badge {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: linear-gradient(135deg, #3b82f6, #6366f1);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 14px;
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
    }
    .brand-title {
      font-size: 14px;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: -0.2px;
    }
    .brand-sub {
      font-size: 10px;
      color: #94a3b8;
    }
    .pulse-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 10px #10b981;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(1.2); }
      100% { opacity: 1; transform: scale(1); }
    }
    .status-card {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 16px;
      margin-top: 16px;
      backdrop-filter: blur(10px);
    }
    .status-label {
      font-size: 10px;
      text-transform: uppercase;
      font-weight: 700;
      color: #64748b;
      letter-spacing: 0.5px;
    }
    .status-val {
      font-size: 15px;
      font-weight: 800;
      color: #38bdf8;
      margin-top: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .metrics-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 12px;
    }
    .metric-box {
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 12px;
      padding: 12px;
    }
    .metric-num {
      font-size: 18px;
      font-weight: 900;
      font-family: monospace;
      color: #f1f5f9;
      margin-top: 2px;
    }
    .footer {
      font-size: 10px;
      color: #64748b;
      text-align: center;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      padding-top: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .badge-privacy {
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: #34d399;
      padding: 2px 8px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 9px;
    }
  </style>
</head>
<body>
  <div>
    <div class="header">
      <div class="brand">
        <div class="logo-badge">360</div>
        <div>
          <div class="brand-title">360CRM Desktop Tracker</div>
          <div class="brand-sub">Enterprise Active Telemetry</div>
        </div>
      </div>
      <div style="display:flex;align-items:center;gap:6px;">
        <div class="pulse-dot"></div>
        <span style="font-size:11px;font-weight:700;color:#10b981;">ACTIVE</span>
      </div>
    </div>

    <div class="status-card">
      <div class="status-label">Current Active Window</div>
      <div class="status-val" id="activeWindowText">Google Chrome - 360CRM Workspace</div>
    </div>

    <div class="metrics-grid">
      <div class="metric-box">
        <div class="status-label">Shift Duration</div>
        <div class="metric-num" style="color:#60a5fa;" id="shiftTimeText">04:15:20</div>
      </div>
      <div class="metric-box">
        <div class="status-label">Active Screen Time</div>
        <div class="metric-num" style="color:#34d399;" id="screenTimeText">03:52:10</div>
      </div>
      <div class="metric-box">
        <div class="status-label">Idle Inactivity</div>
        <div class="metric-num" style="color:#fbbf24;" id="idleTimeText">00:08:10</div>
      </div>
      <div class="metric-box">
        <div class="status-label">Sync Status</div>
        <div class="metric-num" style="color:#a78bfa;font-size:13px;padding-top:4px;" id="syncStatusText">🟢 Connected</div>
      </div>
    </div>
  </div>

  <div class="footer">
    <span class="badge-privacy">🔒 Zero-Surveillance Compliance</span>
    <span>v1.0.0 Enterprise</span>
  </div>
</body>
</html>
